name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-hf-space.yml"

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        if: env.HF_TOKEN != '' && env.HF_SPACE_REPO != ''
        run: |
          git config --global user.email "bot@cortexlab.ai"
          git config --global user.name "CortexLab CI/CD"
          # Sync subtree backend to HF Space
          git subtree push --prefix backend https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_REPO main
